[workspace]
resolver = "2"
members = ["crates/app", "crates/core", "crates/daemon", "crates/tray"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha2 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
hex = "0.4"
log = "0.4"
simplelog = "0.12"
chrono = { version = "0.4", features = ["clock"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
