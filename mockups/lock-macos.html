<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>StretchLock macOS 纯净版</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: #15151a;
    font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .stage {
    width: 420px; height: 630px; position: relative;
    background:
      radial-gradient(140% 90% at 50% -10%, rgba(80,120,180,0.28), transparent 55%),
      radial-gradient(120% 90% at 50% 110%, rgba(60,60,90,0.4), transparent 60%),
      #15151a;
    border-radius: 28px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  .clock {
    margin-top: 54px; color: #fff; font-size: 64px; font-weight: 300;
    letter-spacing: 2px; font-variant-numeric: tabular-nums;
  }
  .date { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 6px; letter-spacing: .5px; }
  .avatar {
    margin-top: 54px; width: 92px; height: 92px; border-radius: 50%;
    background: linear-gradient(135deg, #4a6fa5, #7b5ea7);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; color: #fff;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }
  .name { margin-top: 20px; color: #fff; font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  .field {
    margin-top: 46px; width: 288px; height: 50px; border-radius: 25px;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.14);
    display: flex; align-items: center; gap: 12px; padding: 0 20px;
    box-shadow: 0 0 0 1.5px rgba(10,132,255,0.55), 0 0 20px rgba(10,132,255,0.30);
  }
  .field .lock { font-size: 16px; opacity: .6; }
  .field .ph { color: rgba(255,255,255,0.45); font-size: 15px; }
  .bottom {
    margin-top: auto; margin-bottom: 34px; display: flex; gap: 16px;
  }
  .b {
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255,255,255,0.10); border: 1px solid rgba(255,255,255,0.14);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="clock">19:24</div>
    <div class="date">11 月 6 日 星期四</div>
    <div class="avatar">🙂</div>
    <div class="name">StretchLock</div>
    <div class="field">
      <span class="lock">🔒</span>
      <span class="ph">输入口令</span>
    </div>
    <div class="bottom">
      <div class="b">🔌</div>
      <div class="b">♻️</div>
      <div class="b">💤</div>
    </div>
  </div>
</body>
</html>
